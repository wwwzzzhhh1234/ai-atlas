# Collection sources, queries and inclusion thresholds (spec Section 7).
# All numbers are starting guesses — revisit after the first M1 report.

# Fixed collection date. Query strings (and therefore cache keys) are derived from it, so re-runs
# hit the cache. Change it only to take a NEW snapshot (it will re-query everything).
snapshot_date: 2026-11-22

github:
  api_base: https://api.github.com
  graphql_url: https://api.github.com/graphql
  search_max_results_per_query: 1000   # GitHub Search API cap; slice queries below this
  topics:
    - llm
    - ai-agent
    - ai-agents
    - agentic-ai
    - mcp
    - mcp-server
    - model-context-protocol
    - agent-skills
    - claude-skills
    - rag
    - langchain
    - langgraph
    - crewai
    - autogen
    - n8n
    - dify
    - generative-ai
    - llmops
    - guardrails
    - ai-safety
  # Keyword groups target niche sectors so they are not drowned out.
  # `niche: true` groups use the lower star threshold.
  keyword_groups:
    # Finds MCP servers by search instead of looking up all ~33k registry repos one by one
    # (registry repos that also match these queries are merged with their registry entry).
    mcp_servers:
      sector: null
      niche: false
      min_stars: 20               # same as min_stars_by_group.mcp_registry
      queries: ["mcp", "model context protocol"]
    # Each group runs: every entry of `queries`, every "<term> <modifier>" pair, and every `topic:<t>`.
    # Short, domain-specific terms (2026-11-22 revision) so niche sectors are not missed.
    healthcare:
      sector: S01
      niche: true                 # human decision 2026-11-22: treat healthcare as niche (>= 20 stars)
      queries: ["clinical llm", "medical ai agent", "radiology llm", "ehr llm", "drug discovery llm"]
      terms: [medical, clinical, healthcare, radiology, biomedical, fhir, "drug discovery", "medical imaging",
              pathology, "mental health", ehr, protein]
      modifiers: [ai, agent, llm, vision, mcp]
      topics: [medical-ai, healthcare-ai, medical-imaging, medical-image-analysis, clinical-nlp, biomedical-nlp,
               medical-llm, drug-discovery, computational-pathology]
    agriculture_climate:
      sector: S02
      niche: true
      queries: ["agriculture llm", "crop ai agent", "climate llm", "energy grid ai agent", "food supply chain ai"]
      terms: [agriculture, crop, "plant disease", farming, "precision agriculture", climate, "weather forecasting",
              "smart grid", energy, solar, battery, carbon, food]
      modifiers: [ai, agent, llm, "deep learning", mcp]
      topics: [precision-agriculture, plant-disease-detection, crop-yield-prediction, smart-agriculture,
               climate-ai, weather-forecasting, energy-forecasting, load-forecasting]
    governance_safety:
      sector: S05.4
      niche: true
      queries: ["llm guardrails", "agent governance", "ai compliance llm", "llm red teaming", "agent sandbox"]
    finance_legal:
      sector: S05
      niche: false
      queries: ["finance llm agent", "legal llm", "contract review llm", "accounting ai agent"]
    smart_city_transport:
      sector: S09
      niche: true
      queries: ["autonomous driving llm", "traffic signal reinforcement learning llm", "smart city ai agent", "urban digital twin ai", "public transit ai"]
      terms: ["autonomous driving", self-driving, traffic, "digital twin", urban, v2x, "smart city", transportation,
              vehicle, lidar, "trajectory prediction", parking]
      modifiers: [ai, agent, llm, "deep learning", vision]
      topics: [autonomous-driving, self-driving-car, end-to-end-autonomous-driving, traffic-signal-control,
               traffic-prediction, traffic-forecasting, trajectory-prediction, smart-city, intelligent-transportation]
    startup:
      sector: S10
      niche: true
      queries: ["startup ai agent", "pitch deck generator llm", "market research ai agent", "business plan llm", "no-code mvp ai"]
      terms: [startup, "pitch deck", "business plan", "market research", investor, fundraising, "venture capital",
              "go-to-market", "product hunt", mvp, "no-code", "landing page", "competitor analysis", founder]
      modifiers: [ai, agent, llm, gpt]
  skill_files:
    code_search_query: "filename:SKILL.md"
    size_slices: ["0..1000", "1001..2000", "2001..4000", "4001..8000", "8001..16000", ">16000"]
    max_pages_per_slice: 10
    min_interval_seconds: 6.5     # code search: 10 requests/min
  curated_lists:   # parsed for repo links (README via raw.githubusercontent.com); lists themselves get asset_type=resource
    - anthropics/skills
    - heilcheng/awesome-agent-skills
    - github/awesome-copilot
  search:
    # Adaptive slicing: a query with > 1000 hits is split by star range, then by creation date,
    # until every slice returns <= 1000 results (GitHub Search API cap).
    per_page: 100
    max_results_per_slice: 1000
    created_from: "2008-01-01"    # lower bound for date slicing only
    min_interval_seconds: 2.2     # search API: 30 requests/min
    # Freshness is pushed into the query (spec Section 7: created >= 2025-01-01 OR pushed within 12 months).
    # Each base query is run once per clause below; {pushed_cutoff} = today - or_pushed_within_months.
    freshness_clauses:
      - "pushed:>={pushed_cutoff}"
      - "created:>=2025-01-01 pushed:<{pushed_cutoff}"
    extra_qualifiers: "archived:false"
    repo_lookup_batch_size: 6      # repo:a/b qualifiers per search query (query length limit 256)

github_raw:
  base_url: https://raw.githubusercontent.com
  readme_candidates: [README.md, readme.md, Readme.md, README.MD, README.rst, README.txt, README]
  min_interval_seconds: 0.05

mcp_registry:
  base_url: https://registry.modelcontextprotocol.io
  api_version: v0.1   # verified 2026-11-22 (v0 also responds; v0.1 is current)
  # false: do NOT look up GitHub metadata for every registry repo (33k+ repos = hours of search calls).
  # Registry repos get metadata only if a search query (topics / mcp_servers group) also finds them.
  lookup_repos: false
  page_size: 100
  min_interval_seconds: 0.3

huggingface:
  api_base: https://huggingface.co
  sort_by: likes
  max_models: 2000
  max_spaces: 2000
  page_size: 100
  min_likes: 50                   # (Gemini suggested >= 20; the list is already cut at 50)
  # Spaces often have a README that is only config. Their excerpt is stitched from
  # title + short description + SDK/models/datasets/tags + README body. Only *informative* text
  # (title + short description + README body) counts toward this minimum; tags/SDK do not.
  space_min_informative_chars: 100
  min_interval_seconds: 0.5

filters:
  require_ai_related: true
  exclude_forks: true
  exclude_archived: true
  min_readme_chars: 200
  freshness:
    created_on_or_after: "2025-01-01"
    or_pushed_within_months: 12
  min_stars_default: 100
  min_stars_niche: 20             # repos found by a keyword group with niche: true
  min_stars_by_group:             # starting guesses, revisit after the first report
    skill_file: 20
    curated: 20                   # human decision 2026-11-22: nothing below 20 stars anywhere
    mcp_registry: 20
  niche_sectors: [S01, S02, S05.4, S09, S10]   # S01 added by human decision 2026-11-22
  # A record is AI-related if it came from an AI source/topic/keyword search,
  # or its name/description/topics match this pattern (used for curated-list links).
  ai_keywords: "\\b(ai|llm|llms|gpt|agent|agents|agentic|mcp|rag|langchain|llama|claude|gemini|openai|copilot|genai|generative|machine.learning|deep.learning|neural|transformer|diffusion|chatbot|embedding|prompt|skill|skills)\\b"
  readme_excerpt_max_chars: 12000 # ~3,000 tokens

http:
  max_retries: 5
  backoff_base_seconds: 2
  timeout_seconds: 30
